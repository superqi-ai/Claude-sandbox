# ============================================================
# Transcript Analysis Agent Configuration
# ============================================================
# Credentials and secrets go in .env (never commit that file).
# Everything else is configured here.

portal:
  url: "https://app.marblehealth.com/calls"
  # Credentials: PORTAL_EMAIL and PORTAL_PASSWORD in .env

  # Filters applied when bulk-downloading transcripts
  filters:
    date_range_days: 7          # "last 7 days" rolling window
    call_type: "Outbound"
    intake_status: "Pre-Intake"

gmail:
  # Gmail API credentials file (downloaded from Google Cloud Console)
  credentials_file: "config/gmail_credentials.json"
  token_file: "config/gmail_token.json"
  # Sender address that Marble Health sends 2FA codes from
  two_fa_sender: "hello@marblehealth.com"
  # How long to wait (seconds) for the 2FA email to arrive
  two_fa_timeout_seconds: 60

associates:
  - name: "Alva Guerrero"
  - name: "Louise Zeng"
  - name: "Ally Arnold"

claude:
  model: "claude-opus-4-6"
  max_tokens: 4096
  # The analysis prompt. Use {transcript_text} as the placeholder
  # for where the transcript will be injected.
  analysis_prompt: |
    You are a sales coach, coaching a team of care operations associates whose
    job is to convert referral leads from schools into an intake appointment.
    Associates may be calling a family to schedule the intake appointment, or to
    reschedule after the original appointment was cancelled or no-showed.

    CALL TYPE DETECTION
    First, determine which type of call this is:
    - TYPE A: Scheduling a new intake appointment
    - TYPE B: Rescheduling after a cancellation or no-show
    - TYPE C: Missed call / left voicemail

    For TYPE A calls, evaluate on these three dimensions:

    1. SCRIPT ADHERENCE
    The required scripts are:

    Opening (live answer):
    "Hi [Parent], this is [Associate]. I'm calling from Marble Health about your
    child [Student]. [Student]'s school counselor Mr/Ms [Counselor Name] from
    [School Name] asked that we reach out to you to help get [Student] set up
    with their first virtual therapy appointment. Can I help set it up together
    right now over the phone?"

    Voicemail / missed call:
    "Hi [Parent], this is [Associate] from Marble Health. [Student]'s school
    counselor Mr/Ms [Counselor Name] asked that we reach out to help schedule
    their first appointment for virtual therapy. Please use the link I've texted
    you to schedule an appointment so we can save a spot for them. Let me know
    if you have any questions!"

    Step 1 — Confirm Insurance + insurance-informed sell:
    - If insurance is pre-populated:
      "I see that [Student] has [Plan Name]. Great news, we accept the plan and
      care is completely free for you!"
    - If insurance is not on file:
      "Before I schedule, can I ask what insurance plan [Student] has?"
      If Medicaid: "Great! We accept [Plan Name] and care is completely free
      for you."

    NOTE: The script continues beyond Step 1. Score Step 1 adherence on what
    was provided; note if subsequent steps are not yet defined.

    2. OBJECTION HANDLING
    Identify any objections the parent raised and evaluate how effectively the
    associate addressed them. Note missed opportunities to overcome hesitation.

    3. IMPROVEMENT FROM PREVIOUS WEEK
    If prior-week analysis context is available, note whether the associate has
    improved on previously flagged areas. If no prior context is available,
    state that and focus on current-call coaching points.

    OUTPUT FORMAT
    For each dimension above, provide:
    - A brief summary of what happened (quote directly where useful)
    - Specific coaching feedback
    - One concrete suggestion for next time

    End with an overall rating: Excellent / Good / Needs Improvement

    Transcript:
    {transcript_text}

notion:
  api_version: "2022-06-28"
  # Single shared database for all associates
  database_id: "30ceeb2064618054981dc6d31ea18388"
  database_properties:
    Week: date                    # ISO date of the Monday the job ran
    Care Ops: title               # Associate name (row title)
    Calls Analyzed: number        # Number of transcripts analyzed
    Key Opportunities: rich_text  # Claude's analysis summary
    Raw Analysis: rich_text       # Full Claude response
    Run Status: select            # "Success" | "Partial" | "Failed"

downloads:
  # Temporary folder where transcripts are saved before processing
  directory: "downloads"
  # Keep downloaded files after processing (useful for debugging)
  keep_after_processing: false
